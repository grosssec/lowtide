<rect x="20" y="128" width="230" height="132" rx="14" fill="#ffffff" stroke="#e3e2dc" />
<text x="38" y="158" font-size="15" font-weight="600" fill="#0c0c0b">Lowtide app</text>
<text x="38" y="182" font-size="13.5" fill="#4b4a46">React, installable on a phone</text>
