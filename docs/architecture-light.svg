<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Lowtide architecture: the app talks to a Cloudflare Worker with a D1 database; a Google Apps Script sends bank emails and timesheet hours; a daily cron sends an encrypted push notification through Apple and Google push services back to the app.">
