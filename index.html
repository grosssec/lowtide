<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Lowtide forecasts your balance day by day, from your paychecks, bills and plans, and tells you what is safe to spend before payday." />
    <meta name="theme-color" content="#f5f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default" keeps dark status bar text on the light theme; iOS tints the bar with theme-color. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lowtide" />
    <meta name="application-name" content="Lowtide" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="Lowtide · Know what's safe to spend" />
    <meta property="og:description" content="A day-by-day forecast of your balance, built for paychecks that change. See your low tide before it comes." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lowtide" />
    <meta property="og:image" content="https://demo.ricardogross.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lowtide: the Month screen with what is safe to spend and the forecast of the balance" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Lowtide</title>
    <style>
      /*
       * Splash: painted before any script runs, then replaced by <Splash /> (src/components/Brand.tsx) with the same markup.
       * The moon rises over the water, then the water keeps moving gently until the app is ready.
       */
      .splash { position: fixed; inset: 0; display: grid; place-items: center; background: #f5f5f1; }
      .splash svg { width: 76px; height: 76px; border-radius: 18px; box-shadow: 0 18px 40px -16px rgba(12, 12, 11, 0.55); }
      .splash .lt-moon, .splash .lt-wave, .splash .lt-ripple { transform-box: view-box; }
      @media (prefers-color-scheme: dark) {
        .splash { background: #0a0a0a; }
        .splash svg { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 18px 40px -16px rgba(0, 0, 0, 0.9); }
      }
      @media (prefers-reduced-motion: no-preference) {
        .splash svg { animation: lt-in 0.5s 0.05s ease-out both; }
        .splash .lt-moon { animation: lt-rise 1.5s 0.15s cubic-bezier(0.16, 0.84, 0.3, 1) both, lt-float 3.6s 1.7s ease-in-out infinite alternate; }
        .splash .lt-halo { animation: lt-glow 1.8s 0.2s ease-out both; }
        .splash .lt-wave { animation: lt-drift 3.2s ease-in-out infinite alternate; }
        .splash .lt-ripple { animation: lt-drift 3.2s 0.5s ease-in-out infinite alternate-reverse; }
        @keyframes lt-in { from { opacity: 0; transform: scale(0.94); } }
        @keyframes lt-rise { from { transform: translateY(16px); } to { transform: none; } }
        @keyframes lt-float { to { transform: translateY(-0.9px); } }
        @keyframes lt-glow { from { opacity: 0; } }
        @keyframes lt-drift { from { transform: translateX(-1.3px); } to { transform: translateX(1.3px); } }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="Loading"><!-- lowtide-splash --></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
