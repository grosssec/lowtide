<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Personal cash flow: what came in, what went out, and what is safe to spend." />
    <meta name="theme-color" content="#f5f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Finance" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Finance</title>
    <style>
      /* Splash: painted before any script runs, then replaced by the app. Mirrors <Splash /> in src/components/ui.tsx. */
      .splash { position: fixed; inset: 0; display: grid; place-items: center; background: #f5f5f1; }
      .splash svg { width: 56px; height: 56px; animation: splash-in 0.4s 0.15s ease-out both; }
      @keyframes splash-in { from { opacity: 0; transform: scale(0.96); } }
      .splash .mark { fill: #0c0c0b; }
      .splash .bar { stroke: #f5f5f1; stroke-width: 2.6; stroke-linecap: round; transform-origin: center bottom; transform-box: fill-box; }
      .splash .accent { stroke: #2a78d6; }
      @media (prefers-color-scheme: dark) {
        .splash { background: #0a0a0a; }
        .splash .mark { fill: #f7f7f5; }
        .splash .bar { stroke: #0a0a0a; }
        .splash .accent { stroke: #4b93ea; }
      }
      @media (prefers-reduced-motion: no-preference) {
        .splash .bar { animation: grow 1.1s cubic-bezier(0.5, 0, 0.2, 1) infinite alternate; }
        .splash .bar:nth-of-type(2) { animation-delay: 0.12s; }
        .splash .bar:nth-of-type(3) { animation-delay: 0.24s; }
        .splash .bar:nth-of-type(4) { animation-delay: 0.36s; }
        @keyframes grow { from { transform: scaleY(0.45); } to { transform: scaleY(1); } }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="Loading">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect class="mark" width="32" height="32" rx="8" />
          <path class="bar" d="M8 22.5V17" />
          <path class="bar" d="M13.4 22.5V12" />
          <path class="bar" d="M18.7 22.5v-7" />
          <path class="bar accent" d="M24 22.5V9.5" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
